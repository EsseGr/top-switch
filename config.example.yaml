# Example config — fake values only. Secrets come from the environment as ${NAME}
# (or from a file via NAME_FILE=/path). A missing variable makes startup fail.
api_token: "${TOP_SWITCH_API_TOKEN}"   # required; protects all of /api/*
timezone: Europe/Athens                # default: $TZ, else Europe/Athens

plugins:
  adguard:
    url: "${ADGUARD_URL}"              # e.g. http://host.docker.internal:3080
    username: "${ADGUARD_USERNAME}"
    password: "${ADGUARD_PASSWORD}"

buttons:
  - id: reading-time
    name: "Ώρα διαβάσματος"
    icon: "📚"
    confirm: "Να μπλοκαριστούν οι επιλεγμένες συσκευές;"
    toggle:
      on:
        type: plugin
        plugin: adguard.block
        selector: &kids                # static selector; the API never accepts devices from the client
          ids: ["192.0.2.10", "192.0.2.11"]                     # plain IPv4 only (no MAC, CIDR, IPv6 or ClientID)
          clients: ["Example Persistent Client"]                # persistent client names (all their ids must be plain IPv4)
      off:
        type: plugin
        plugin: adguard.unblock        # removes only the user rules this button added (tracked in state.json)
      status:
        type: plugin
        plugin: adguard.status
        selector: *kids
    schedule:                          # every day 17:00-20:00 on, then off
      - days: [mon, tue, wed, thu, fri, sat, sun]
        on: "17:00"
        off: "20:00"

